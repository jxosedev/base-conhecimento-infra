site_name: Base de Conhecimento - Infraestrutura
site_description: Documentacao de suporte, infraestrutura e runbooks
site_author: Time de Infraestrutura

repo_name: jxosedev/base-conhecimento-infra
repo_url: https://github.com/jxosedev/base-conhecimento-infra

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/server-network
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - announce.dismiss

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.escapeall
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: jxosedev
      repo: base-conhecimento-infra

plugins:
  - search

extra_css:
  - stylesheets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jxosedev
  generator: false

nav:
  - Inicio: index.md
  - Guia de Uso:
      - Primeiros Passos: guia/primeiros-passos.md
      - Como Contribuir: guia/como-contribuir.md
      - Padrao de Documentacao: guia/padrao-documentacao.md
  - Infraestrutura:
      - Servidores:
          - Visao Geral: infra/servidores/README.md
          - webapp-prod-01: infra/servidores/webapp-prod-01.md
          - webapp-prod-02: infra/servidores/webapp-prod-02.md
          - db-master-01: infra/servidores/db-master-01.md
          - db-replica-01: infra/servidores/db-replica-01.md
          - ci-runner-01: infra/servidores/ci-runner-01.md
          - monitor-01: infra/servidores/monitor-01.md
          - jump-prod-01: infra/servidores/jump-prod-01.md
      - Rede:
          - Visao Geral: infra/rede/README.md
          - Topologia: infra/rede/topologia.md
          - Equipamentos: infra/rede/equipamentos.md
          - VPN e Acesso Remoto: infra/rede/vpn.md
          - Troubleshooting:
              - Queda de Link: infra/rede/troubleshooting-queda-link.md
              - Lentidao de Rede: infra/rede/troubleshooting-lentidao.md
      - Armazenamento: infra/armazenamento/README.md
      - Cloud: infra/cloud/README.md
  - Runbooks:
      - Incidentes:
          - Visao Geral: runbooks/incidentes/README.md
          - Queda de Link: runbooks/incidentes/queda-link.md
          - Lentidao de Rede: runbooks/incidentes/lentidao-rede.md
          - Servico Down: runbooks/incidentes/servico-down.md
          - DDoS: runbooks/incidentes/ddos.md
          - Disco Cheio: runbooks/incidentes/disco-cheio.md
          - SSL Expirado: runbooks/incidentes/ssl-expirado.md
      - Manutencoes:
          - Visao Geral: runbooks/manutencoes/README.md
          - Manutencao de Servidores: runbooks/manutencoes/manutencao-servidores.md
          - Patch Management: runbooks/manutencoes/patch-management.md
          - Renovacao SSL: runbooks/manutencoes/renovacao-ssl.md
          - Limpeza de Disco: runbooks/manutencoes/limpeza-disco.md
      - Backups:
          - Visao Geral: runbooks/backups/README.md
          - Backup de Banco: runbooks/backups/backup-banco.md
          - Backup de Arquivos: runbooks/backups/backup-arquivos.md
          - Verificacao: runbooks/backups/verificacao.md
          - Restauracao: runbooks/backups/restauracao.md
  - Procedimentos (POP):
      - Onboarding: pop/onboarding.md
      - Offboarding: pop/offboarding.md
      - Acesso a Producao: pop/acesso-producao.md
  - Politicas:
      - Seguranca: politicas/seguranca.md
      - Backup: politicas/backup.md
      - Escalonamento: politicas/escalonamento.md
