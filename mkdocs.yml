site_name: Base de Conhecimento - Infraestrutura
site_description: Documentacao de suporte, infraestrutura e runbooks
site_author: Time de Infraestrutura

repo_name: jxosedev/base-conhecimento-infra
repo_url: https://github.com/jxosedev/base-conhecimento-infra

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - navigation.separator
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/server-network
  font:
    text: Inter
    code: JetBrains Mono
  custom_dir: docs/overrides

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.escapeall
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: jxosedev
      repo: base-conhecimento-infra

plugins:
  - search

extra_css:
  - stylesheets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jxosedev
  generator: false

nav:
  - Inicio: index.md
  - ":material-book-open-variant: Guia de Uso":
      - Primeiros Passos: guia/primeiros-passos.md
      - Como Contribuir: guia/como-contribuir.md
      - Padrao de Documentacao: guia/padrao-documentacao.md
  - ":material-server: Infraestrutura":
      - ":material-server: Servidores":
          - Lista de Servidores: infra/servidores/README.md
          - ":material-desktop-classic: webapp-prod-01": infra/servidores/webapp-prod-01.md
          - ":material-desktop-classic: webapp-prod-02": infra/servidores/webapp-prod-02.md
          - ":material-database: db-master-01": infra/servidores/db-master-01.md
          - ":material-database: db-replica-01": infra/servidores/db-replica-01.md
          - ":material-cog: ci-runner-01": infra/servidores/ci-runner-01.md
          - ":material-chart-line: monitor-01": infra/servidores/monitor-01.md
          - ":material-lock: jump-prod-01": infra/servidores/jump-prod-01.md
      - ":material-network: Rede":
          - Rede - Visao Geral: infra/rede/README.md
          - ":material-map-marker-path: Topologia": infra/rede/topologia.md
          - ":material-switch-network: Equipamentos": infra/rede/equipamentos.md
          - ":material-vpn: VPN e Acesso Remoto": infra/rede/vpn.md
          - ":material-wrench: Troubleshooting":
              - ":material-link-off: Queda de Link": infra/rede/troubleshooting-queda-link.md
              - ":material-speedometer: Lentidao de Rede": infra/rede/troubleshooting-lentidao.md
      - ":material-harddisk: Armazenamento": infra/armazenamento/README.md
      - ":material-cloud: Cloud": infra/cloud/README.md
  - ":material-ambulance: Runbooks":
      - ":material-alert-circle: Incidentes":
          - Runbooks de Incidentes: runbooks/incidentes/README.md
          - ":material-link-off: Queda de Link": runbooks/incidentes/queda-link.md
          - ":material-speedometer: Lentidao de Rede": runbooks/incidentes/lentidao-rede.md
          - ":material-server-off: Servico Down": runbooks/incidentes/servico-down.md
          - ":material-shield-half-full: DDoS": runbooks/incidentes/ddos.md
          - ":material-harddisk: Disco Cheio": runbooks/incidentes/disco-cheio.md
          - ":material-lock-open: SSL Expirado": runbooks/incidentes/ssl-expirado.md
      - ":material-tools: Manutencoes":
          - Runbooks de Manutencoes: runbooks/manutencoes/README.md
          - ":material-server: Manutencao de Servidores": runbooks/manutencoes/manutencao-servidores.md
          - ":material-update: Patch Management": runbooks/manutencoes/patch-management.md
          - ":material-certificate: Renovacao SSL": runbooks/manutencoes/renovacao-ssl.md
          - ":material-broom: Limpeza de Disco": runbooks/manutencoes/limpeza-disco.md
      - ":material-database-sync: Backups":
          - Runbooks de Backups: runbooks/backups/README.md
          - ":material-database: Backup de Banco": runbooks/backups/backup-banco.md
          - ":material-folder-zip: Backup de Arquivos": runbooks/backups/backup-arquivos.md
          - ":material-check-circle: Verificacao": runbooks/backups/verificacao.md
          - ":material-restore: Restauracao": runbooks/backups/restauracao.md
  - ":material-clipboard-text: Procedimentos (POP)":
      - ":material-account-plus: Onboarding": pop/onboarding.md
      - ":material-account-minus: Offboarding": pop/offboarding.md
      - ":material-key: Acesso a Producao": pop/acesso-producao.md
  - ":material-shield-check: Politicas":
      - ":material-security: Seguranca": politicas/seguranca.md
      - ":material-cloud-download: Backup": politicas/backup.md
      - ":material-phone-alert: Escalonamento": politicas/escalonamento.md
