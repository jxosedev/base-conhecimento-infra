site_name: Base de Conhecimento - Infraestrutura
site_description: Documentacao de suporte, infraestrutura e runbooks
site_author: Time de Infraestrutura

repo_name: jxosedev/base-conhecimento-infra
repo_url: https://github.com/jxosedev/base-conhecimento-infra

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    # Navegacao
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
    # Busca
    - search.suggest
    - search.highlight
    - search.share
    # Conteudo
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/server
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  # --- PYTHON-MARKDOWN BASE ---
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      permalink_class: headerlink
      permalink_title: "Link direto"

  # --- PYMDOWNX: BLOCOS E ESTRUTURA ---
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - docs/includes/snippets.md

  # --- PYMDOWNX: TABELAS E LISTAS ---
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true

  # --- PYMDOWNX: EMOJI E ICONES ---
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # --- PYMDOWNX: MATEMATICA ---
  - pymdownx.arithmatex:
      generic: true

  # --- PYMDOWNX: OUTROS ---
  - pymdownx.critic
  - pymdownx.escapeall
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: jxosedev
      repo: base-conhecimento-infra

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jxosedev
    - icon: fontawesome/brands/slack
      link: https://empresa.slack.com
  generator: false

nav:
  - Inicio: index.md
  - Guia de Uso:
      - Primeiros Passos: guia/primeiros-passos.md
      - Como Contribuir: guia/como-contribuir.md
      - Padrao de Documentacao: guia/padrao-documentacao.md
  - Infraestrutura:
      - Servidores:
          - Indice: infra/servidores/README.md
          - webapp-prod-01: infra/servidores/webapp-prod-01.md
          - webapp-prod-02: infra/servidores/webapp-prod-02.md
          - db-master-01: infra/servidores/db-master-01.md
          - db-replica-01: infra/servidores/db-replica-01.md
          - ci-runner-01: infra/servidores/ci-runner-01.md
          - monitor-01: infra/servidores/monitor-01.md
          - jump-prod-01: infra/servidores/jump-prod-01.md
      - Rede:
          - Indice: infra/rede/README.md
          - Topologia: infra/rede/topologia.md
          - Equipamentos: infra/rede/equipamentos.md
          - VPN: infra/rede/vpn.md
          - Troubleshooting:
              - Queda de Link: infra/rede/troubleshooting-queda-link.md
              - Lentidao: infra/rede/troubleshooting-lentidao.md
      - Armazenamento: infra/armazenamento/README.md
      - Cloud: infra/cloud/README.md
  - Runbooks:
      - Incidentes:
          - Indice: runbooks/incidentes/README.md
          - Queda de Link: runbooks/incidentes/queda-link.md
          - Lentidao de Rede: runbooks/incidentes/lentidao-rede.md
          - Servico Down: runbooks/incidentes/servico-down.md
          - DDoS: runbooks/incidentes/ddos.md
          - Disco Cheio: runbooks/incidentes/disco-cheio.md
          - SSL Expirado: runbooks/incidentes/ssl-expirado.md
      - Manutencoes:
          - Indice: runbooks/manutencoes/README.md
          - Manutencao de Servidores: runbooks/manutencoes/manutencao-servidores.md
          - Patch Management: runbooks/manutencoes/patch-management.md
          - Renovacao SSL: runbooks/manutencoes/renovacao-ssl.md
          - Limpeza de Disco: runbooks/manutencoes/limpeza-disco.md
      - Backups:
          - Indice: runbooks/backups/README.md
          - Backup de Banco: runbooks/backups/backup-banco.md
          - Backup de Arquivos: runbooks/backups/backup-arquivos.md
          - Verificacao: runbooks/backups/verificacao.md
          - Restauracao: runbooks/backups/restauracao.md
  - Procedimentos (POP):
      - Onboarding: pop/onboarding.md
      - Offboarding: pop/offboarding.md
      - Acesso a Producao: pop/acesso-producao.md
  - Politicas:
      - Seguranca: politicas/seguranca.md
      - Backup: politicas/backup.md
      - Escalonamento: politicas/escalonamento.md
